<body class="widget-body">

<main class="widget" id="explorer" data-chart="explorer">

  <h1 class="widget-title">Who’s winning your category?</h1>
  <p class="dek">Pick a category and a specialty. See which partner is the most popular.</p>

  <div class="controls">
    <label>
      <span>Solution category</span>
      <select id="sel-category"></select>
    </label>
    <label>
      <span>Specialty</span>
      <select id="sel-specialty"></select>
    </label>
  </div>

  <div id="explorer-result" class="explorer-result"></div>

</main>

<script src="app.js"></script>
